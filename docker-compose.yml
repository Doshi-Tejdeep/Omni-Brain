services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnibrain:latest
    container_name: omnibrain-backend
    working_dir: /app
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - .:/app
    restart: unless-stopped

  frontend:
    image: omnibrain:latest
    container_name: omnibrain-frontend
    working_dir: /app
    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - .:/app
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: omnibrain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  qa:
    image: omnibrain:latest
    container_name: omnibrain-qa
    working_dir: /app
    command:
      - pytest
    volumes:
      - .:/app

volumes:
  ollama-data:
